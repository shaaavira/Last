<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Note For Ali - Quest Mode</title>
    <!-- Google Fonts: Pinyon Script & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            min-height: 100dvh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff3d1 0%, #ffdfba 50%, #ffc6d9 100%);
            background-attachment: fixed;
            color: #5c4033;
            font-size: 22px;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Soft Glow */
        .ambient-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        .circle-1 {
            width: 450px;
            height: 450px;
            background: #ffecb6;
            top: -80px;
            left: -80px;
        }

        .circle-2 {
            width: 500px;
            height: 500px;
            background: #ffb4b0;
            bottom: -80px;
            right: -80px;
        }

        /* Falling Flowers Animation Container */
        #falling-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .falling-flower {
            position: absolute;
            top: -10vh;
            user-select: none;
            pointer-events: none;
            animation: fallDown linear infinite;
        }

        @keyframes fallDown {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.8;
            }
            85% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(110vh) translateX(30px) rotate(360deg);
                opacity: 0;
            }
        }

        .wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
        }

        .box-container {
            width: 100%;
            background: rgba(255, 253, 245, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 3px solid rgba(255, 223, 186, 0.95);
            border-radius: 52px;
            padding: 65px 56px 55px 56px;
            box-shadow: 0 40px 80px rgba(210, 150, 120, 0.32), 0 0 60px rgba(255, 255, 255, 0.7) inset;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 1180px;
            position: relative;
        }

        .box-container::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            bottom: 18px;
            border: 2px dashed rgba(224, 122, 95, 0.25);
            border-radius: 40px;
            pointer-events: none;
        }

        .cover-content {
            margin: auto 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .cover-title {
            font-family: 'Pinyon Script', cursive;
            font-size: 8.5rem;
            color: #4a3b32;
            line-height: 1.1;
            font-weight: 400;
            text-shadow: 2px 2px 4px rgba(212, 131, 72, 0.1);
            margin-bottom: 24px;
        }

        .cover-subtitle {
            font-family: 'Poppins', sans-serif;
            font-size: 1.25rem;
            font-weight: 500;
            color: #a07865;
            letter-spacing: 0.5px;
            max-width: 520px;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        /* Menu / Quest Log Styles */
        .menu-main-title {
            font-family: 'Pinyon Script', cursive;
            font-size: 5.5rem;
            color: #4a3b32;
            margin-bottom: 24px;
            line-height: 1.1;
            text-align: center;
        }

        .menu-stack {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin: 15px 0;
        }

        .menu-item-card {
            background: #ffffff;
            border: 3px solid rgba(255, 209, 102, 0.6);
            padding: 24px 28px;
            border-radius: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
            box-shadow: 0 6px 18px rgba(255, 209, 102, 0.2);
        }

        .menu-item-card:hover:not(.locked) {
            background: #fffbf0;
            border-color: #f4a261;
            transform: translateX(6px);
            box-shadow: 0 8px 24px rgba(244, 162, 97, 0.25);
        }

        .menu-item-card.locked {
            background: #f7f5f0;
            border-color: rgba(0, 0, 0, 0.06);
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }

        .menu-item-info h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #4a3b32;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .menu-item-card.locked .menu-item-info h3 {
            color: #94a3b8;
        }

        .quest-status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .badge-available { background: rgba(34, 197, 94, 0.15); color: #15803d; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-completed { background: rgba(59, 130, 246, 0.15); color: #1d4ed8; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-locked { background: rgba(0, 0, 0, 0.05); color: #6b7280; border: 1px solid rgba(0, 0, 0, 0.1); }

        .menu-item-action {
            font-family: 'Poppins', sans-serif;
            font-size: 1.25rem;
            color: #f4a261;
            font-weight: 600;
        }
        .menu-item-card.locked .menu-item-action {
            color: #94a3b8;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid rgba(255, 223, 186, 0.8);
            padding-bottom: 20px;
            margin-top: -15px;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }

        .card-brand {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #e07a5f;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slides-container {
            display: flex;
            position: relative;
            overflow: hidden;
            min-height: 720px;
            margin: 15px 0;
            align-items: center;
            z-index: 2;
        }

        .slide {
            position: absolute;
            width: 100%;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            text-align: left;
        }

        .slide.active {
            display: flex;
            opacity: 1;
            position: relative;
        }

        .slide-number {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #e07a5f;
            margin-bottom: 28px;
            text-transform: uppercase;
        }

        .slide-text {
            font-family: 'Poppins', sans-serif;
            font-size: 1.85rem;
            line-height: 1.9;
            color: #4a3b32;
            font-weight: 400;
            word-break: break-word;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 25px;
            padding-bottom: 5px;
            border-top: 3px solid rgba(255, 223, 186, 0.8);
            margin-bottom: -15px;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .btn {
            background: #ffffff;
            border: 3px solid #ffd166;
            color: #d48348;
            padding: 22px 24px;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 209, 102, 0.38);
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s ease;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
        }

        .back-menu-btn {
            background: #fff1f2;
            border-color: #fca5a5;
            color: #e11d48;
            padding: 22px 20px;
        }
        .back-menu-btn:hover:not(:disabled) {
            background: #ffe4e6;
        }

        .btn-primary {
            background: #f4a261;
            color: #ffffff;
            border-color: #f4a261;
            width: 100%;
            padding: 26px;
            font-size: 1.75rem;
            box-shadow: 0 8px 25px rgba(244, 162, 97, 0.4);
        }

        .dots {
            display: flex;
            gap: 8px;
            align-items: center;
            max-width: 150px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .dots::-webkit-scrollbar {
            display: none;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(244, 162, 97, 0.3);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .dot.active {
            width: 30px;
            border-radius: 5px;
            background: #f4a261;
        }

        /* Quest Complete Screen */
        .quest-complete-content {
            margin: auto 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="ambient-circle circle-1"></div>
    <div class="ambient-circle circle-2"></div>
    <div id="falling-container"></div>
    <div id="youtube-player" style="display:none;"></div>

    <div class="wrapper">
        <!-- 1. Cover Screen -->
        <div class="box-container" id="coverScreen">
            <div></div>
            <div class="cover-content">
                <div class="cover-title">A Note For Ali</div>
                <div class="cover-subtitle">Catatan khusus yang disiapkan untuk Ali</div>
            </div>
            <div>
                <button class="btn btn-primary" onclick="goToMenu()">
                    Buka Catatan ✨
                </button>
            </div>
        </div>

        <!-- 2. Menu / Quest Log Screen -->
        <div class="box-container hidden" id="menuScreen">
            <div>
                <div class="menu-main-title">Pilih Sesi Catatan</div>
            </div>
            <div class="menu-stack" id="menuListContainer">
                <!-- Disuntikkan via JS -->
            </div>
            <div>
                <div style="font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 600; color: #a07865; text-align: center; margin-bottom: 18px;" id="questProgressText">
                    Progress: 0 / 3 Chapter Selesai
                </div>
                <button class="btn" onclick="backToCover()" style="width: 100%; border-radius: 50px;">← Kembali ke Cover</button>
            </div>
        </div>

        <!-- 3. Reader Screen (Slides) -->
        <div class="box-container hidden" id="mainCard">
            <div class="card-header">
                <span class="card-brand" id="cardBrandTitle">🍯 The Root Cause</span>
                <span id="slideCounterText" style="font-family: 'Poppins', sans-serif; font-size: 1.25rem; font-weight: 600; color: #8c6d59;">1 / 15</span>
            </div>

            <div class="slides-container" id="slidesWrapper">
                <!-- Disuntikkan via JS -->
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn back-menu-btn" onclick="confirmBackToMenu()">
                    ✕ Menu
                </button>
                <button class="btn" id="prevBtn" onclick="changeSlide(-1)" disabled>
                    ← Prev
                </button>
                
                <div class="dots" id="dotsContainer">
                    <!-- Disuntikkan via JS -->
                </div>

                <button class="btn" id="nextBtn" onclick="nextAction()">
                    Next →
                </button>
            </div>
        </div>

        <!-- 4. Quest Complete Screen -->
        <div class="box-container hidden" id="questCompleteScreen">
            <div></div>
            <div class="quest-complete-content">
                <div class="cover-title" style="font-size: 6.5rem; margin-bottom: 25px;">Terima Kasih</div>
                <div style="font-family: 'Poppins', sans-serif; font-size: 1.25rem; font-weight: 500; color: #a07865;" id="completedQuestDesc">sudah membaca chapter ini dengan baik, Ali</div>
            </div>
            <div>
                <button class="btn btn-primary" onclick="returnToMenuFromComplete()">
                    Kembali ke Daftar Chapter ✨
                </button>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Falling Flowers generator
        const flowers = ['🌸', '🌼', '🌷', '🌻', '💮'];
        const container = document.getElementById('falling-container');
        for (let i = 0; i < 6; i++) {
            const span = document.createElement('div');
            span.classList.add('falling-flower');
            span.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (Math.random() * 4 + 7) + 's';
            span.style.animationDelay = (Math.random() * 5) + 's';
            span.style.fontSize = (Math.random() * 4 + 22) + 'px';
            container.appendChild(span);
        }

        // Quest Progress Status
        let questStatus = {
            1: { completed: false, unlocked: true, title: "The Root Cause" },
            2: { completed: false, unlocked: false, title: "How Runi Sees Ali" },
            3: { completed: false, unlocked: false, title: "Last Message for Ali" }
        };

        // YouTube Player setup
        let player;
        let isAppStarted = false;
        const START_TIME = 0;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'l5luP-A1nvM',
                playerVars: {
                    'autoplay': 0,
                    'loop': 1,
                    'playlist': 'l5luP-A1nvM',
                    'start': START_TIME
                },
                events: {
                    'onReady': (event) => {
                        if (isAppStarted) {
                            event.target.seekTo(START_TIME, true);
                            event.target.playVideo();
                        }
                    }
                }
            });
        }

        function goToMenu() {
            isAppStarted = true;
            document.getElementById('coverScreen').classList.add('hidden');
            renderMenuList();
            document.getElementById('menuScreen').classList.remove('hidden');

            if (player && typeof player.playVideo === 'function') {
                player.seekTo(START_TIME, true);
                player.playVideo();
            }
        }

        function backToCover() {
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('coverScreen').classList.remove('hidden');
        }

        function renderMenuList() {
            const container = document.getElementById('menuListContainer');
            container.innerHTML = '';
            
            let completedCount = 0;

            for (let id = 1; id <= 3; id++) {
                const quest = questStatus[id];
                if (quest.completed) completedCount++;

                let badgeHtml = '';
                let actionText = 'Mulai →';
                let cardClass = 'menu-item-card';

                if (quest.completed) {
                    badgeHtml = `<span class="quest-status-badge badge-completed">Selesai</span>`;
                    actionText = 'Ulangi ↺';
                } else if (quest.unlocked) {
                    badgeHtml = `<span class="quest-status-badge badge-available">Tersedia</span>`;
                } else {
                    badgeHtml = `<span class="quest-status-badge badge-locked">Terkunci 🔒</span>`;
                    actionText = 'Terkunci';
                    cardClass += ' locked';
                }

                const itemCard = document.createElement('div');
                itemCard.className = cardClass;
                itemCard.innerHTML = `
                    <div class="menu-item-info">
                        <h3>Chapter ${id}: ${quest.title} ${badgeHtml}</h3>
                    </div>
                    <div class="menu-item-action">${actionText}</div>
                `;

                if (quest.unlocked) {
                    itemCard.onclick = () => openSection(id);
                } else {
                    itemCard.onclick = () => alert("Selesaikan chapter sebelumnya terlebih dahulu ya, Ali! ✨");
                }

                container.appendChild(itemCard);
            }

            document.getElementById('questProgressText').innerText = `Progress: ${completedCount} / 3 Chapter Selesai`;
        }

        function confirmBackToMenu() {
            if (confirm("Keluar dari chapter ini, Ali? Progress membaca di chapter ini akan direset.")) {
                backToMenu();
            }
        }

        function backToMenu() {
            document.getElementById('mainCard').classList.add('hidden');
            document.getElementById('questCompleteScreen').classList.add('hidden');
            renderMenuList();
            document.getElementById('menuScreen').classList.remove('hidden');
        }

        // 3 Chapters Content Data
        const sectionsData = {
            1: [
                "Hai Li, mungkin lu agak kaget nerima tulisan ini, tapi gua rasa ini cara yang paling clear buat nutup semuanya.",
                "Sebenarnya waktu gua tanya kenapa kita berantem mulu, gua udah tau jawabannya, Li. Waktu itu sengaja gua jawab ga tau karena penasaran sama pov lu, dan ya menurut lu gua satu-satunya subjek masalah. So, let me give you the actual picture of what was really happening.",
                "Gua udah dari lama sadar, interaksi kita selama setengah tahun ini ga sejalan. Tiap ada masalah, reaksi kita selalu kontras. Dimana lu tipikal orang yang lebih milih withdraw, mendem sendiri, atau ambil keputusan diem-diem dan itu yang buat gua nerima mixed signals. Sementara gua tipe yang outspoken, maunya langsung dibahas, dikejar kejelasannya, dan diberesin saat itu juga dan itu yang buat lu ngerasa tertekan.",
                "Not to mention, pas masuk ranah perasaan, kita juga saling tabrakan. Gua butuh transparansi, tapi lu lebih nyaman megang kendali sendiri. Dari awal udah berasa ko Li dimana semakin gua buka diri seluas-luasnya, semakin tinggi juga boundary lu. Alhasil kita sama-sama cape, gua cape nebak-nebak dan lu mungkin cape karena ngerasa ditekan.",
                "Fun fact, kita berdua emang sama-sama egois. Lu punya prinsip sendiri, dan gua punya standar sendiri. Ujungnya kita cuma saling nyakitin.",
                "Intinya, masih banyak yang harus kita pelajarin. Semoga tulisan gua ini bisa bikin kita lebih kenal sama diri masing-masing. Sukses buat kedepannya."
            ],
            2: [

                "Mismipun lu seru diajak diskusi, lu beberapa kali nunjukin sikap ga suka dikoreksi kalau lagi salah. Lu bahkan pernah bilang kalau gua lu ga perlu repot-repot ngasih masukan di saat gua liat sikap lu yang menurut gua kurang pas.",

                "Lastly, semoga lu makin open minded nerima masukan, cause debates and discussions bakal jauh lebih seru kalau lu ga ngerasa lagi attacked.",
                "Anyway, thanks for the chaos, the debates, and everything in between. Semoga whatever u pursue next, semuanya dimudahkan."
            ],
            3: [
                "Dari semua evaluasi dan caramu bersikap itu, akhirnya gua sampai pada kesimpulan buat nulis pesan ini.",
                "Thanks for the gift, and i'm glad we managed to exchange gifts. A bit late, but happy 24th birthday.",
                "Through this message, gua beneran mau pamit. Thanks for everything, terutama buat pertemanan kita selama setengah tahun ini.",
                "Makasih udah dipersilakan pergi, jadi gua bisa pergi tanpa rasa bersalah dan ga perlu mikir buat balik lagi kayak sebelum-sebelumnya.",
                "My feelings for u are gone, dan di titik ini gua sadar kalau kita emang ga bisa berteman secara wajar tanpa terus-terusan saling nyakitin.",
                "Dari evaluasi gua belakangan, i realized komunikasi kita sering ga sejalan dan gua masih punya banyak hal yang harus diperbaiki, termasuk cara pandang gua yang sering kejebak di ego sendiri.",
                "Lu pernah jelasin tentang ego gua, gua rasa itu bener. Selama ini tulisan gua selalu dari pov gua aja, dan i need to learn buat mulai lihat dari pov orang lain.",
                "At the end of the day, gua yakin kalau ikhlas itu jauh lebih indah.",
                "If we're truly meant to cross paths again, we'll know how to find our way back to each other.",
                "Kalaupun bukan takdirnya, it's okay, maybe we only met to learn from each other. Jadi, i don't need to be afraid to walk away anymore.",
                "Maybe when u finish reading this note, I've already blocked u. I'm so sorry. Aku ga bermaksud untuk mutus silaturahim, but i need to take my own time dan fokus ke diri sendiri.",
                "Tapi, kalau ada hal penting or feedback yang pengen lu sampein, u can send it to my email at karuniashavira@gmail.com.",
                "Thanks for everything, and i truly wish the best for both of us."
            ]
        };

        let currentSection = 1;
        let currentSlide = 0;
        let totalSlides = 0;
        
        const slidesWrapper = document.getElementById('slidesWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCounterText = document.getElementById('slideCounterText');
        const dotsContainer = document.getElementById('dotsContainer');
        const cardBrandTitle = document.getElementById('cardBrandTitle');

        function openSection(sectionId) {
            currentSection = sectionId;
            currentSlide = 0;
            const data = sectionsData[sectionId];
            totalSlides = data.length;

            // Set pojok kiri atas menyesuaikan judul chapter
            cardBrandTitle.innerText = `🍯 ${questStatus[sectionId].title}`;

            // Render slides
            slidesWrapper.innerHTML = '';
            data.forEach((text, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;
                
                const numberDiv = document.createElement('div');
                numberDiv.className = 'slide-number';
                numberDiv.innerText = `Bagian ${String(index + 1).padStart(2, '0')}`;

                const textDiv = document.createElement('div');
                textDiv.className = 'slide-text';
                textDiv.innerHTML = text.replace(/\n/g, '<br>');
                
                slideDiv.appendChild(numberDiv);
                slideDiv.appendChild(textDiv);
                slidesWrapper.appendChild(slideDiv);
            });

            // Render dots
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i === 0) dot.classList.add('active');
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }

            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('mainCard').classList.remove('hidden');
            updateSlideUI();
        }

        const slides = () => document.querySelectorAll('.slide');
        const dots = () => document.querySelectorAll('.dot');

        function updateSlideUI() {
            const currentSlides = slides();
            const currentDots = dots();

            currentSlides.forEach((slide, index) => {
                slide.classList.remove('active');
                if (index === currentSlide) {
                    slide.classList.add('active');
                }
            });

            currentDots.forEach((dot, index) => {
                dot.classList.remove('active');
                if (index === currentSlide) {
                    dot.classList.add('active');
                }
            });

            slideCounterText.innerText = `${currentSlide + 1} / ${totalSlides}`;
            prevBtn.disabled = currentSlide === 0;
            
            if (currentSlide === totalSlides - 1) {
                nextBtn.innerHTML = 'Selesaikan ✓';
            } else {
                nextBtn.innerHTML = 'Next →';
            }
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= totalSlides) currentSlide = totalSlides - 1;
            updateSlideUI();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlideUI();
        }

        function nextAction() {
            if (currentSlide === totalSlides - 1) {
                // Tandai chapter selesai
                questStatus[currentSection].completed = true;
                
                // Buka chapter berikutnya secara otomatis jika ada
                if (currentSection < 3) {
                    questStatus[currentSection + 1].unlocked = true;
                }

                showQuestCompleteScreen();
            } else {
                changeSlide(1);
            }
        }

        function showQuestCompleteScreen() {
            document.getElementById('mainCard').classList.add('hidden');
            document.getElementById('questCompleteScreen').classList.remove('hidden');
        }

        function returnToMenuFromComplete() {
            document.getElementById('questCompleteScreen').classList.add('hidden');
            renderMenuList();
            document.getElementById('menuScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
