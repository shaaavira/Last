<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Note For Ali - Quest Mode</title>
    <!-- Google Fonts: Playfair Display & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            min-height: 100dvh;
            font-family: 'Montserrat', sans-serif;
            /* Gradasi Kuning agak Pink yang Manis & Hangat */
            background: linear-gradient(135deg, #fff2e6 0%, #ffdfd3 50%, #fcd5e5 100%);
            background-attachment: fixed;
            color: #3b2e1e;
            font-size: 20px;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow (Kuning & Pink Lembut) */
        .ambient-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        .circle-1 {
            width: 500px;
            height: 500px;
            background: #ffcc6f; /* Warm Golden Yellow */
            top: -100px;
            left: -100px;
        }

        .circle-2 {
            width: 550px;
            height: 550px;
            background: #ffb3c6; /* Soft Rose Pink */
            bottom: -100px;
            right: -100px;
        }

        /* Falling Elements Container */
        #falling-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .falling-element {
            position: absolute;
            top: -10vh;
            user-select: none;
            pointer-events: none;
            animation: fallDown linear infinite;
        }

        @keyframes fallDown {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.9;
            }
            85% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(110vh) translateX(70px) rotate(360deg);
                opacity: 0;
            }
        }

        .wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
        }

        /* Kotak Cerah Elegan */
        .box-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(233, 179, 57, 0.5);
            border-radius: 40px;
            padding: 65px 56px 55px 56px;
            box-shadow: 0 30px 60px rgba(212, 160, 23, 0.15), 0 0 30px rgba(255, 243, 205, 0.5) inset;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 1100px;
            position: relative;
        }

        .box-container::before {
            content: '';
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            bottom: 16px;
            border: 1px dashed rgba(212, 160, 23, 0.35);
            border-radius: 32px;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        /* --- 1. COVER LAYOUT --- */
        .cover-content {
            margin: auto 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .cover-title {
            font-family: 'Playfair Display', serif;
            font-size: 6.5rem;
            color: #735100;
            line-height: 1.1;
            font-weight: 700;
            text-shadow: 0 4px 15px rgba(233, 179, 57, 0.25);
            margin-bottom: 20px;
        }

        .cover-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            font-weight: 500;
            color: #8c6a39;
            letter-spacing: 0.5px;
            max-width: 520px;
            line-height: 1.6;
        }

        /* --- 2. MENU / QUEST LOG LAYOUT --- */
        .menu-main-title {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: #735100;
            margin-bottom: 28px;
            line-height: 1.1;
        }

        .menu-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 15px 0;
        }

        .menu-item-card {
            background: #fffdf5;
            border: 2px solid rgba(233, 179, 57, 0.4);
            padding: 22px 26px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(212, 160, 23, 0.08);
        }

        .menu-item-card:hover:not(.locked) {
            background: #fff8e1;
            border-color: #d49811;
            transform: translateX(6px);
            box-shadow: 0 6px 20px rgba(212, 160, 23, 0.2);
        }

        .menu-item-card.locked {
            background: #f5f3ef;
            border-color: rgba(0, 0, 0, 0.06);
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }

        .menu-item-info h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #3b2e1e;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item-card.locked .menu-item-info h3 {
            color: #9e968c;
        }

        .quest-status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .badge-available { background: rgba(34, 197, 94, 0.15); color: #15803d; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-completed { background: rgba(59, 130, 246, 0.15); color: #1d4ed8; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-locked { background: rgba(0, 0, 0, 0.05); color: #6b7280; border: 1px solid rgba(0, 0, 0, 0.1); }

        .menu-item-action {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            color: #b38200;
            font-weight: 600;
        }
        .menu-item-card.locked .menu-item-action {
            color: #9e968c;
        }

        /* --- 3. READER / SLIDE LAYOUT --- */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid rgba(233, 179, 57, 0.3);
            padding-bottom: 20px;
            margin-top: -15px;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }

        .card-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #735100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slides-container {
            display: flex;
            position: relative;
            overflow: hidden;
            min-height: 680px;
            margin: 15px 0;
            align-items: center;
            z-index: 2;
        }

        .slide {
            position: absolute;
            width: 100%;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            text-align: left;
        }

        .slide.active {
            display: flex;
            opacity: 1;
            position: relative;
        }

        .slide-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.7rem;
            line-height: 1.9;
            color: #3b2e1e;
            font-weight: 400;
            word-break: break-word;
        }

        /* --- CONTROLS & FOOTER --- */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 25px;
            padding-bottom: 5px;
            border-top: 2px solid rgba(233, 179, 57, 0.3);
            margin-bottom: -15px;
            gap: 16px;
            position: relative;
            z-index: 2;
        }

        .btn {
            background: #fffdf5;
            border: 2px solid rgba(233, 179, 57, 0.6);
            color: #735100;
            padding: 20px 32px;
            border-radius: 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 160, 23, 0.1);
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            background: #fff8e1;
            border-color: #d49811;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: rgba(0, 0, 0, 0.1);
            color: #9e968c;
            box-shadow: none;
        }

        .back-menu-btn {
            background: rgba(254, 226, 226, 0.8);
            border-color: rgba(239, 68, 68, 0.4);
            color: #b91c1c;
            padding: 20px 24px;
        }
        .back-menu-btn:hover:not(:disabled) {
            background: rgba(254, 202, 202, 0.9);
            border-color: #dc2626;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffc107 0%, #e09f00 100%);
            color: #3b2e1e;
            border-color: #ffda73;
            width: 100%;
            padding: 24px;
            font-size: 1.6rem;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(255, 193, 7, 0.35);
            border-radius: 40px;
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #ffca2c 0%, #d19300 100%);
            color: #261d13;
        }

        .dots {
            display: flex;
            gap: 10px;
            align-items: center;
            max-width: 180px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .dots::-webkit-scrollbar {
            display: none;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(233, 179, 57, 0.3);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .dot.active {
            width: 36px;
            border-radius: 6px;
            background: #d49811;
        }

        /* --- QUEST COMPLETE SCREEN --- */
        .quest-complete-content {
            margin: auto 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="ambient-circle circle-1"></div>
    <div class="ambient-circle circle-2"></div>
    <div id="falling-container"></div>
    <div id="youtube-player" style="display:none;"></div>

    <div class="wrapper">
        <!-- 1. Cover Screen -->
        <div class="box-container" id="coverScreen">
            <div></div>
            <div class="cover-content">
                <div class="cover-title">A Note For Ali</div>
                <div class="cover-subtitle">Sebuah catatan khusus yang disiapkan untuk Ali</div>
            </div>
            <div>
                <button class="btn btn-primary" onclick="goToMenu()">
                    Buka Catatan 🐝🌼
                </button>
            </div>
        </div>

        <!-- 2. Menu / Quest Log Screen -->
        <div class="box-container hidden" id="menuScreen">
            <div>
                <div class="menu-main-title">Pilih Sesi Catatan</div>
            </div>
            <div class="menu-stack" id="menuListContainer">
                <!-- Disuntikkan via JS -->
            </div>
            <div>
                <div style="font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 600; color: #8c6a39; text-align: center; margin-bottom: 16px;" id="questProgressText">
                    Progress: 0 / 3 Misi Selesai
                </div>
                <button class="btn" onclick="backToCover()" style="width: 100%; border-radius: 40px;">← Kembali ke Cover</button>
            </div>
        </div>

        <!-- 3. Reader Screen (Slides / Quest Mode) -->
        <div class="box-container hidden" id="mainCard">
            <div class="card-header">
                <span class="card-brand">🐝 A Note For Ali</span>
                <span id="slideCounterText" style="font-family: 'Montserrat', sans-serif; font-size: 1.25rem; font-weight: 600; color: #8c6a39;">1 / 15</span>
            </div>

            <div class="slides-container" id="slidesWrapper">
                <!-- Disuntikkan via JS -->
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn back-menu-btn" onclick="confirmBackToMenu()">
                    ✕ Menu
                </button>
                <button class="btn" id="prevBtn" onclick="changeSlide(-1)" disabled>
                    ← Prev
                </button>
                
                <div class="dots" id="dotsContainer">
                    <!-- Disuntikkan via JS -->
                </div>

                <button class="btn" id="nextBtn" onclick="nextAction()">
                    Next →
                </button>
            </div>
        </div>

        <!-- 4. Quest Complete Screen -->
        <div class="box-container hidden" id="questCompleteScreen">
            <div></div>
            <div class="quest-complete-content">
                <div style="font-size: 5rem; margin-bottom: 16px;">🍯</div>
                <div style="font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 600; color: #8c6a39; margin-bottom: 10px;" id="completedQuestDesc">sudah membaca pesannya dengan sangat baik</div>
                <div class="cover-title" style="font-size: 4rem; margin-bottom: 20px;">Terima kasih Ali</div>
            </div>
            <div>
                <button class="btn btn-primary" onclick="returnToMenuFromComplete()">
                    Kembali ke Daftar Misi 🐝
                </button>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Falling Elements generator (Bunga + Honeybee 🐝 dan 🍯)
        const elements = ['🌼', '💮', '🌸', '🏵', '🍁', '☘️', '🌺', '🐝', '🍯'];
        const container = document.getElementById('falling-container');
        for (let i = 0; i < 9; i++) {
            const span = document.createElement('div');
            span.classList.add('falling-element');
            span.innerText = elements[Math.floor(Math.random() * elements.length)];
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (Math.random() * 6 + 6) + 's';
            span.style.animationDelay = (Math.random() * 5) + 's';
            span.style.fontSize = (Math.random() * 6 + 18) + 'px';
            container.appendChild(span);
        }

        // Quest Progress Status
        let questStatus = {
            1: { completed: false, unlocked: true, title: "Last Message for Ali" },
            2: { completed: false, unlocked: false, title: "How Runi Sees Ali" },
            3: { completed: false, unlocked: false, title: "Last Wish for Ali" }
        };

        // YouTube Player setup
        let player;
        let isAppStarted = false;
        const START_TIME = 0;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: 'l5luP-A1nvM',
                playerVars: {
                    'autoplay': 0,
                    'loop': 1,
                    'playlist': 'l5luP-A1nvM',
                    'start': START_TIME
                },
                events: {
                    'onReady': (event) => {
                        if (isAppStarted) {
                            event.target.seekTo(START_TIME, true);
                            event.target.playVideo();
                        }
                    }
                }
            });
        }

        function goToMenu() {
            isAppStarted = true;
            document.getElementById('coverScreen').classList.add('hidden');
            renderMenuList();
            document.getElementById('menuScreen').classList.remove('hidden');

            if (player && typeof player.playVideo === 'function') {
                player.seekTo(START_TIME, true);
                player.playVideo();
            }
        }

        function backToCover() {
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('coverScreen').classList.remove('hidden');
        }

        function renderMenuList() {
            const container = document.getElementById('menuListContainer');
            container.innerHTML = '';
            
            let completedCount = 0;

            for (let id = 1; id <= 3; id++) {
                const quest = questStatus[id];
                if (quest.completed) completedCount++;

                let badgeHtml = '';
                let actionText = 'Mulai →';
                let cardClass = 'menu-item-card';

                if (quest.completed) {
                    badgeHtml = `<span class="quest-status-badge badge-completed">Selesai</span>`;
                    actionText = 'Ulangi ↺';
                } else if (quest.unlocked) {
                    badgeHtml = `<span class="quest-status-badge badge-available">Tersedia</span>`;
                } else {
                    badgeHtml = `<span class="quest-status-badge badge-locked">Terkunci 🔒</span>`;
                    actionText = 'Terkunci';
                    cardClass += ' locked';
                }

                const itemCard = document.createElement('div');
                itemCard.className = cardClass;
                itemCard.innerHTML = `
                    <div class="menu-item-info">
                        <h3>${quest.title} ${badgeHtml}</h3>
                    </div>
                    <div class="menu-item-action">${actionText}</div>
                `;

                if (quest.unlocked) {
                    itemCard.onclick = () => openSection(id);
                } else {
                    itemCard.onclick = () => alert("Selesaikan misi sebelumnya terlebih dahulu untuk membuka chapter ini, Ali! 🛡");
                }

                container.appendChild(itemCard);
            }

            document.getElementById('questProgressText').innerText = `Progress: ${completedCount} / 3 Misi Selesai`;
        }

        function confirmBackToMenu() {
            if (confirm("Keluar dari misi ini, Ali? Progress membaca di chapter ini akan direset.")) {
                backToMenu();
            }
        }

        function backToMenu() {
            document.getElementById('mainCard').classList.add('hidden');
            document.getElementById('questCompleteScreen').classList.add('hidden');
            renderMenuList();
            document.getElementById('menuScreen').classList.remove('hidden');
        }

        // Data Slide Masing-masing Section (Disesuaikan untuk Ali)
        const sectionsData = {
            1: [
                "Hai, Li. Thanks for the gift, and i'm glad we managed to exchange gifts. A bit late, but happy 24th birthday.",
                "Through this message, gua beneran mau pamit. Thanks for everything, terutama buat pertemanan kita selama setengah tahun ini.",
                "Dari evaluasi gua belakangan, i realized komunikasi kita sering ga sejalan dan gua masih punya banyak hal yang harus diperbaiki, termasuk cara pandang gua yang sering kejebak di ego sendiri.",
                "Makasih juga udah kasih kejelasan lewat kalimat lu yang mempersilakan gua pergi kemarin, itu bener-bener ngebantu gua buat ngambil keputusan ini.",
                "So, gua memutuskan buat pamit dan fokus belajar berproses di umur yang baru ini.",
                "My feelings for u are still there, tapi karena itu juga gua sadar gua ga bisa memaksakan diri buat berteman secara wajar sama lu tanpa merasa tersakiti.",
                "Lu pernah jelasin tentang ego gua, gua rasa itu bener. Selama ini tulisan gua selalu dari pov gua aja, dan i need to learn buat mulai lihat dari pov orang lain.",
                "Jujur, dulu hati sama otak gua sering berantem. Otak gua bilang it's time to let go, banyak yang harus diperbaiki, diikhlasin, dan dimulai lagi.",
                "Tapi my heart says otherwise....takut gabisa bikin lu suka gua, takut lu akhirnya nemuin pasangan yang lu cari dan itu bukan gua, atau takut lu bener bener hilang.",
                "But at the end of the day, gua yakin kalau ikhlas itu jauh lebih indah. Gua sadar bentuk usaha ada banyak, ga harus selalu di sekitar lu dan berinteraksi sama lu.",
                "Kalau emang suatu hari nanti u feel the same way, lu pasti tau cara nemuin gua lagi.",
                "Kalaupun bukan takdirnya, it's okay, not all love needs to be reciprocated. Jadi, i don't need to be afraid to walk away anymore.",
                "Let me say 'i love you' for the first and the last time today. I hope this isn't the last chapter for us, i hope someday i can say these words to u again, and maybe hear it back from u.",
                "Please don't reply to this message, Li. Supaya gua bisa bener-bener move on, i will block ur number for a while....bukan buat putus silaturahim, tapi supaya gua bisa take my own time dan fokus ke diri sendiri.",
                "Thanks for everything, and i truly wish the best for both of us."
            ],
            2: [
                "Prinsip lu kuat dan cara lu defend argumen pas kita debat jujur bikin gua kagum. Seorang Ali dengan argumennya yang ga gampang goyah wkwkw.",
                "Deep down, gua tau niat lu emang tulus pengen jadi orang baik.",
                "Walau sering bikin gua cape dan nguras energi banget, to be fair, lu partner debat paling seru.",
                "Lu bisa ngasih perspective yang out of the box. Ada aja sudut pandang tak terduga dari lu yang ngebuka mata gua.",
                "Di balik niat baik lu, lu kadang tetep egois sama keputusan yang lu ambil tanpa mikir perasaan gua, sebatas buat ngelindungin diri lu sendiri.",
                "Lu tertutup banget sama kehidupan lu. I know, mungkin karena emang bukan gua orangnya, bukan gua yang lu pengen jadiin tempat cerita.",
                "Lu sering ga tegas antara iya dan tidak. Seolah lu takut banget dibilang jahat, terkesan lempar batu sembunyi tangan, dan itu malah bikin gua dapet mixed signals yang bikin bingung.",
                "Meskipun lu seru diajak diskusi, lu beberapa kali nunjukin sikap ga suka dikoreksi kalau lagi salah. Lu bahkan pernah bilang kalau gua ga perlu repot-repot ngasih masukan di saat gua liat sikap lu lagi ga bener."
            ],
            3: [
                "Ke depannya, semoga lu bisa grow into a better person, lebih berani jujur sama diri sendiri, dan tegas pas ngambil sikap, tanpa harus takut dicap jahat atau sengaja ngasih mixed signals.",
                "Semoga lu juga ga nutup diri terus, dan bisa nemuin someone who's actually a right fit buat dijadiin tempat cerita tanpa lu harus ngerasa mesti nyelesaiin semuanya sendirian.",
                "Lastly, semoga lu makin open minded nerima masukan, cause debates and discussions bakal jauh lebih seru kalau lu ga ngerasa lagi attacked.",
                "Anyway, thanks for the chaos, the debates, and everything in between. Semoga whatever u pursue next, semuanya dimudahkan. Wish u all the best, Ali."
            ]
        };

        let currentSection = 1;
        let currentSlide = 0;
        let totalSlides = 0;
        
        const slidesWrapper = document.getElementById('slidesWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCounterText = document.getElementById('slideCounterText');
        const dotsContainer = document.getElementById('dotsContainer');

        function openSection(sectionId) {
            currentSection = sectionId;
            currentSlide = 0;
            const data = sectionsData[sectionId];
            totalSlides = data.length;

            // Render slides
            slidesWrapper.innerHTML = '';
            data.forEach((text, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;
                
                const textDiv = document.createElement('div');
                textDiv.className = 'slide-text';
                textDiv.innerHTML = text.replace(/\n/g, '<br>');
                
                slideDiv.appendChild(textDiv);
                slidesWrapper.appendChild(slideDiv);
            });

            // Render dots
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (i === 0) dot.classList.add('active');
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }

            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('mainCard').classList.remove('hidden');
            updateSlideUI();
        }

        const slides = () => document.querySelectorAll('.slide');
        const dots = () => document.querySelectorAll('.dot');

        function updateSlideUI() {
            const currentSlides = slides();
            const currentDots = dots();

            currentSlides.forEach((slide, index) => {
                slide.classList.remove('active');
                if (index === currentSlide) {
                    slide.classList.add('active');
                }
            });

            currentDots.forEach((dot, index) => {
                dot.classList.remove('active');
                if (index === currentSlide) {
                    dot.classList.add('active');
                }
            });

            slideCounterText.innerText = `${currentSlide + 1} / ${totalSlides}`;
            prevBtn.disabled = currentSlide === 0;
            
            if (currentSlide === totalSlides - 1) {
                nextBtn.innerHTML = 'Selesaikan Misi ✓';
            } else {
                nextBtn.innerHTML = 'Next →';
            }
        }

        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= totalSlides) currentSlide = totalSlides - 1;
            updateSlideUI();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlideUI();
        }

        function nextAction() {
            if (currentSlide === totalSlides - 1) {
                // Tandai quest selesai
                questStatus[currentSection].completed = true;
                
                // Buka quest berikutnya secara otomatis jika ada
                if (currentSection < 3) {
                    questStatus[currentSection + 1].unlocked = true;
                }

                showQuestCompleteScreen();
            } else {
                changeSlide(1);
            }
        }

        function showQuestCompleteScreen() {
            document.getElementById('mainCard').classList.add('hidden');
            document.getElementById('questCompleteScreen').classList.remove('hidden');
        }

        function returnToMenuFromComplete() {
            document.getElementById('questCompleteScreen').classList.add('hidden');
            renderMenuList();
            document.getElementById('menuScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
